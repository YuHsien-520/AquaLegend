name: AquaLegend source history import

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

concurrency:
  group: aqualegend-source-history-import
  cancel-in-progress: false

jobs:
  import:
    if: github.event.issue.number == 1 && github.event.comment.body == 'FINALIZE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified AquaLegend source-history bundle
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: 3d864f18c8d127fcd19d17d5cbb7bd72dfc8424bac061d70579a37ddd355e2d3
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          comments = []
          page = 1
          while True:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/1/comments?per_page=100&page={page}',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req) as resp:
                  batch = json.load(resp)
              if not batch:
                  break
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          chunks = {}
          pattern = re.compile(r'^BEGIN_CHUNK (\d{4})\s*\n(.*?)\nEND_CHUNK\s*$', re.S)
          for comment in comments:
              body = (comment.get('body') or '').strip()
              m = pattern.match(body)
              if not m:
                  continue
              idx = int(m.group(1))
              chunks[idx] = ''.join(m.group(2).split())

          if not chunks:
              raise SystemExit('no source-history transport chunks found')
          expected_indexes = list(range(max(chunks) + 1))
          if sorted(chunks) != expected_indexes:
              raise SystemExit(f'missing chunk indexes: got {sorted(chunks)}')

          encoded = ''.join(chunks[i] for i in expected_indexes)
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = os.environ['EXPECTED_SHA256']
          if digest != expected:
              raise SystemExit(f'SHA256 mismatch: {digest} != {expected}')

          root = pathlib.Path('.')
          out = root / 'bootstrap' / 'AquaLegend-source-history-2.1.1-to-2.5.5.bundle'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          subprocess.run(['git', 'bundle', 'verify', str(out)], check=True)
          subprocess.run(['git', 'clone', '-q', str(out), '/tmp/aqualegend-history-check'], check=True)
          tags = subprocess.check_output(['git', '-C', '/tmp/aqualegend-history-check', 'tag'], text=True).split()
          wanted = ['2.1.1','2.2.0','2.2.1','2.2.2','2.2.3','2.3.0','2.3.1','2.4.0','2.5.0','2.5.1','2.5.2','2.5.3','2.5.4','2.5.5']
          if tags != wanted:
              raise SystemExit(f'tag verification failed: {tags}')

          (root / 'bootstrap' / 'status.txt').write_text(
              'complete\nversions: 2.1.1-2.5.5\ntransport_chunks: ' + str(len(chunks)) + '\nsha256: ' + digest + '\n', encoding='utf-8')
          PY

          git config user.name 'AquaLegend Archive Bot'
          git config user.email 'archive@aqualegend.local'
          git pull --rebase origin main
          git add bootstrap/AquaLegend-source-history-2.1.1-to-2.5.5.bundle bootstrap/status.txt
          git commit -m 'archive: add complete AquaLegend source history 2.1.1-2.5.5'
          git push origin HEAD:main
