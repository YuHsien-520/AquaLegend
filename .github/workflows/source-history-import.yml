name: AquaLegend source history import

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aqualegend-source-history-import
  cancel-in-progress: false

jobs:
  import:
    if: startsWith(github.event.issue.title, '[AL-HISTORY ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import source-history transport issue
        env:
          EXPECTED_SHA256: 3d864f18c8d127fcd19d17d5cbb7bd72dfc8424bac061d70579a37ddd355e2d3
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess

          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          issue = event['issue']
          title = issue['title']
          body = issue.get('body') or ''
          root = pathlib.Path('.')
          chunks = root / 'bootstrap' / '.history-chunks'
          chunks.mkdir(parents=True, exist_ok=True)

          if title == '[AL-HISTORY FINALIZE]':
              files = sorted(chunks.glob('chunk-*.bin'))
              if not files:
                  raise SystemExit('no source-history chunks found')
              data = b''.join(p.read_bytes() for p in files)
              digest = hashlib.sha256(data).hexdigest()
              expected = os.environ['EXPECTED_SHA256']
              if digest != expected:
                  raise SystemExit(f'SHA256 mismatch: {digest} != {expected}')
              out = root / 'bootstrap' / 'AquaLegend-source-history-2.1.1-to-2.5.5.bundle'
              out.write_bytes(data)
              subprocess.run(['git', 'bundle', 'verify', str(out)], check=True)
              for p in files:
                  p.unlink()
              try:
                  chunks.rmdir()
              except OSError:
                  pass
              (root / 'bootstrap' / 'status.txt').write_text(
                  'complete\nversions: 2.1.1-2.5.5\nsha256: ' + digest + '\n', encoding='utf-8')
          else:
              match = re.fullmatch(r'\[AL-HISTORY (\d{4})\]', title)
              if not match:
                  raise SystemExit('invalid source-history issue title')
              m = re.search(r'BEGIN_BASE64\s*(.*?)\s*END_BASE64', body, re.S)
              if not m:
                  raise SystemExit('missing Base64 markers')
              encoded = ''.join(m.group(1).split())
              data = base64.b64decode(encoded, validate=True)
              (chunks / f'chunk-{match.group(1)}.bin').write_bytes(data)
          PY

          git config user.name 'AquaLegend Archive Bot'
          git config user.email 'archive@aqualegend.local'
          git pull --rebase origin main
          git add -A bootstrap
          git diff --cached --quiet && exit 0
          git commit -m "archive: import ${GITHUB_EVENT_NAME} source-history payload"
          git push origin HEAD:main
